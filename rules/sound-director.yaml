    impact: "allowed"
  description:
    ambience: "allowed"
    sfx: "discouraged"
  lore:
    ambience: "preferred"
    sfx: "minimal"
  escalation:
    sfx: "preferred"
    riser: "preferred"
  supernatural_event:
    sfx: "preferred"
    impact: "allowed"
  climax:
    impact: "preferred"
    silence_after: "preferred"
  reflection:
    ambience: "subtle"
    impact: "forbidden"
